[project.optional-dependencies]
dev = [ ]

[tool.pdm.build]
includes = ["xontrib"]

[build-system]
requires = ["pdm-backend>=2.0.0"]
build-backend = "pdm.backend"

[project]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
authors = [
    {name = "TechnoStrife", email = "technostrife@gmail.com"},
]
license = {text = "MIT"}
requires-python = ">=3.7"
dependencies = [
    "xonsh>=0.12",
]
name = "xontrib-superfile"
version = "0.0.3"
description = "superfile support function for xonsh shell"
readme = "README.md"
keywords = ["xontrib", "xonsh"]
classifiers = ["Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Natural Language :: English", "Operating System :: OS Independent", "Topic :: System :: Shells", "Topic :: System :: System Shells", "Topic :: Terminals", "Programming Language :: Python", "Programming Language :: Python :: 3"]

[project.urls]
Documentation = "https://github.com/TechnoStrife/xontrib-superfile/blob/master/README.md"
Code = "https://github.com/TechnoStrife/xontrib-superfile"
"Issue tracker" = "https://github.com/TechnoStrife/xontrib-superfile/issues"
repository = "https://github.com/TechnoStrife/xontrib-superfile"
